[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "randomize-evolve"
version = "0.1.0"
description = "Evaluation tooling for Levi experiments searching for Bloom filter alternatives."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Paul Tune" }
]
keywords = ["levi", "evolutionary-computation", "bloom-filter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "loguru>=0.7",
  "pydantic>=2",
  "levi @ git+https://github.com/ttanv/levi.git",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.11.0",
]

[dependency-groups]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.11.0",
]

[project.urls]
homepage = "https://github.com/ptuls/randomize-evolve"

[project.scripts]
randomize-evolve-heavy-hitters = "randomize_evolve.problems.heavy_hitters.run:main"
randomize-evolve-packet-switching = "randomize_evolve.problems.packet_switching.run:main"
randomize-evolve-set-membership = "randomize_evolve.problems.set_membership.run:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/randomize_evolve"]
